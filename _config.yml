# about_me_title: The will be displayed as the title in the About Me section
about_me_title: 👋 Acerca de mí
# about_me_description: This will be displayed under the title.
about_me_description0: 🤖 Yo construyo robots. Cofundador & CEO de <a class="highlight-link" href="https://artilrobotics.com" target="_blank" rel="noreferrer">Artil Robotics</a>.
about_me_description1: 🎓 Ingeniero en Mecatrónica con Maestría en Inteligencia de Negocios y Ciencia de Datos.
about_me_description2: 🚁 Lidero proyectos de robótica y automatización con drones (PX4, ROS 2), visión artificial, sistemas embebidos y computadores NVIDIA a bordo.
about_me_description3: 📚 He publicado en revistas indexadas en Scopus, Springer, IOP Science y ScienceDirect.
about_me_description4: 🏆 Ganador de la fase 1 de la OpenCV Spatial AI Competition (Intel & Microsoft) y alumni del programa Huawei Seeds for the Future.
about_me_description5: 💰 Experiencia en levantamiento de capital (fundraising) para proyectos tecnológicos. 🖲️ En mis ratos libres desarrollo un robot móvil que resuelve laberintos. <a class="highlight-link" href="https://github.com/macheloortiz" target="_blank" rel="noreferrer">GitHub</a>
