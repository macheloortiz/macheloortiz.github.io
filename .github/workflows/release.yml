name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - claude/website-modernize-cv-updates-gorydc
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag del release (se crea si no existe)"
        required: false
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v2.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete stale release/tag pointing to another commit
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          CURRENT=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$GITHUB_SHA" ]; then
            gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true
            git push origin ":refs/tags/$TAG" || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.tag.outputs.name }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ steps.tag.outputs.name }} · Portafolio renovado"
          generate_release_notes: true
          body: |
            ## 🚀 Nueva versión de la página

            - ✨ Rediseño moderno: tema oscuro con acentos en gradiente, tarjetas tipo glass y nueva tipografía.
            - 🤖 Habilidades actualizadas: PX4, ROS 2, Isaac Sim, OpenCV, NVIDIA Jetson, Fundraising y más.
            - 🗓️ Experiencia actualizada: Artil Robotics (Cofundador & CEO), Aerialoop y Maestría en Inteligencia de Negocios y Ciencia de Datos.
            - 📫 Contacto simplificado: marcelo@artilrobotics.com (sin número telefónico).
