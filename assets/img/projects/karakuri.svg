<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Karakuri, robot móvil armable">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="kacc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="kglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="270" fill="url(#kbg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 45h480M0 90h480M0 135h480M0 180h480M0 225h480"/>
    <path d="M60 0v270M120 0v270M180 0v270M240 0v270M300 0v270M360 0v270M420 0v270"/>
  </g>
  <circle cx="240" cy="140" r="120" fill="url(#kglow)"/>
  <ellipse cx="240" cy="216" rx="120" ry="10" fill="#000000" opacity="0.35"/>
  <!-- antena -->
  <line x1="240" y1="60" x2="240" y2="88" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="240" cy="56" r="7" fill="#8b5cf6"/>
  <circle cx="240" cy="56" r="12" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="2"/>
  <!-- cuerpo -->
  <rect x="150" y="88" width="180" height="92" rx="18" fill="#121826" stroke="url(#kacc)" stroke-width="3"/>
  <!-- ojos -->
  <circle cx="205" cy="126" r="15" fill="#0b1017" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="275" cy="126" r="15" fill="#0b1017" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="205" cy="126" r="6" fill="#38bdf8"/>
  <circle cx="275" cy="126" r="6" fill="#38bdf8"/>
  <!-- boca / rejilla -->
  <g stroke="#8b5cf6" stroke-width="3" stroke-linecap="round">
    <line x1="222" y1="156" x2="258" y2="156"/>
    <line x1="230" y1="164" x2="250" y2="164"/>
  </g>
  <!-- panel lateral -->
  <g stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <line x1="163" y1="104" x2="163" y2="164"/>
    <line x1="317" y1="104" x2="317" y2="164"/>
  </g>
  <!-- ruedas -->
  <circle cx="180" cy="196" r="26" fill="#0b1017" stroke="url(#kacc)" stroke-width="4"/>
  <circle cx="300" cy="196" r="26" fill="#0b1017" stroke="url(#kacc)" stroke-width="4"/>
  <circle cx="180" cy="196" r="9" fill="#1d2740"/>
  <circle cx="300" cy="196" r="9" fill="#1d2740"/>
  <!-- señal bluetooth -->
  <g fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M366 96a26 26 0 0 1 0 36"/>
    <path d="M378 84a44 44 0 0 1 0 60"/>
  </g>
  <g fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M114 96a26 26 0 0 0 0 36"/>
    <path d="M102 84a44 44 0 0 0 0 60"/>
